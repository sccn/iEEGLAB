name: wiki

# Copies the tutorial pages in docs/ to this repository's wiki, which the EEGLAB
# website reads for its plugin pages. Edit the pages in docs/: the wiki pages are
# overwritten at each change.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out iEEGLAB
        uses: actions/checkout@v4

      - name: Copy docs/ to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          find wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/*.md wiki/
          # Links between pages: page.md in the repository, page in the wiki
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[A-Za-z0-9_-]*)?\)/](\1\2)/g' wiki/*.md
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
          else
            git commit -m "Pages from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push
          fi
